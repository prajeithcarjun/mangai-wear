<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mangai Wear</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    color:#2f1d15;

    /* BASE COLOR */
    background:#f7ead8;

    /* FLORAL TEXTURE */
    background-image:url('https://www.transparenttextures.com/patterns/leaf.png');
    background-size:200px;
}

/* HEADER */
header{
    background:#fff8f0;
    padding:14px;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #e2d1bd;
}

.brand{
    font-family:'Playfair Display',serif;
    font-size:26px;
    color:#8b1e2d;
}

.search-box{
    margin-top:10px;
}

.search-box input{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid #d8c2ab;
    font-size:15px;
    outline:none;
}

/* HERO (INDIAN STYLE) */
.hero{
    margin:16px;
    border-radius:20px;
    overflow:hidden;

    background:linear-gradient(135deg,#8b1e2d,#c44536,#8b1e2d);
    color:white;
    padding:30px 20px;
    text-align:center;
}

.hero h2{
    font-family:'Playfair Display',serif;
    font-size:24px;
}

.hero p{
    font-size:14px;
    opacity:.9;
}

/* TABS */
.tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 16px;
}

.tab{
    padding:10px 18px;
    border-radius:30px;
    border:1px solid #ddd;
    background:white;
    cursor:pointer;
    white-space:nowrap;
    font-size:14px;
}

.tab.active{
    background:#8b1e2d;
    color:white;
    border:none;
}

/* PRODUCTS */
.products{
    padding:16px;
}

.card{
    background:white;
    border-radius:16px;
    margin-bottom:16px;
    overflow:hidden;
    box-shadow:0 6px 14px rgba(0,0,0,.05);
}

.card img{
    width:100%;
    height:auto;
    display:block;
}

.card-content{
    padding:12px;
}

.name{
    font-size:15px;
    font-weight:500;
}

.old{
    font-size:13px;
    text-decoration:line-through;
    color:#888;
}

.price{
    color:#8b1e2d;
    font-weight:600;
}
</style>
</head>

<body>

<header>
    <div class="brand">Mangai Wear</div>

    <div class="search-box">
        <input id="searchInput" placeholder="Search kurtis...">
    </div>
</header>

<div class="hero">
    <h2>Elegant Kurti Collection</h2>
    <p>Inspired by Indian Heritage ✨</p>
</div>

<div class="tabs">
    <div class="tab active" onclick="showCategory(event,'new')">New Arrivals</div>
    <div class="tab" onclick="showCategory(event,'sale')">Sale</div>
    <div class="tab" onclick="showCategory(event,'all')">All Kurtis</div>
</div>

<div class="products" id="productGrid"></div>

<script>

/* PRODUCTS */
const products = [
{name:"Floral Cotton Kurti",old:"₹1899",price:"₹1299",category:"new",img:"images/kurti1.jpg"},
{name:"Elegant Party Kurti",old:"₹2199",price:"₹1599",category:"sale",img:"images/kurti2.jpg"},
{name:"Printed Daily Kurti",old:"₹1799",price:"₹1199",category:"new",img:"images/kurti3.jpg"},
{name:"Festive Wear Kurti",old:"₹2499",price:"₹1899",category:"sale",img:"images/kurti4.jpg"},
{name:"Classic Straight Kurti",old:"₹2099",price:"₹1499",category:"new",img:"images/kurti5.jpg"},
{name:"Summer Rayon Kurti",old:"₹1699",price:"₹1199",category:"new",img:"images/kurti6.jpg"},
{name:"Designer Kurti Set",old:"₹2999",price:"₹2299",category:"sale",img:"images/kurti7.jpg"},
{name:"Casual Office Kurti",old:"₹1899",price:"₹1399",category:"new",img:"images/kurti8.jpg"}
];

let filtered = products.filter(p => p.category === "new");

/* RENDER */
function render(){
    const grid = document.getElementById("productGrid");
    grid.innerHTML = "";

    if(filtered.length === 0){
        grid.innerHTML = "<p>No products found</p>";
        return;
    }

    filtered.forEach(p=>{
        grid.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <div class="card-content">
                <div class="name">${p.name}</div>
                <div class="old">${p.old}</div>
                <div class="price">${p.price}</div>
            </div>
        </div>
        `;
    });
}

/* CATEGORY */
function showCategory(e,type){

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    e.target.classList.add("active");

    if(type==="new"){
        filtered = products.filter(p=>p.category==="new");
    }
    else if(type==="sale"){
        filtered = products.filter(p=>p.category==="sale");
    }
    else{
        filtered = products;
    }

    render();
}

/* SEARCH */
const search = document.getElementById("searchInput");

search.addEventListener("focus", ()=>{
    window.scrollTo(0,0);
});

search.addEventListener("input", function(){

    let val = this.value.toLowerCase().trim();

    if(val===""){
        filtered = products.filter(p=>p.category==="new");
    }
    else if(val.includes("sale")){
        filtered = products.filter(p=>p.category==="sale");
    }
    else{
        filtered = products.filter(p =>
            p.name.toLowerCase().includes(val)
        );
    }

    render();
});

render();

</script>

</body>
</html>
