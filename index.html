<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mangai Wear</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f7ead8;
    color:#2f1d15;
}

/* HEADER */
header{
    background:#7a0f14;
    color:#f7ead8;
    padding:12px 16px;
    position:sticky;
    top:0;
    z-index:100;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
}

.logo img{
    width:40px;
}

.logo span{
    font-family:'Playfair Display',serif;
    font-size:18px;
}

/* MENU */
.menu{
    display:flex;
    gap:12px;
    font-size:13px;
}

.menu div{
    cursor:pointer;
}

/* HERO */
.hero{
    background:linear-gradient(135deg,#8b1e2d,#a8322a);
    color:#f7ead8;
    padding:20px;
}

.hero h1{
    font-family:'Playfair Display',serif;
    font-size:26px;
}

.hero p{
    font-size:13px;
    margin-top:6px;
}

.btn{
    margin-top:12px;
    display:inline-block;
    padding:10px 18px;
    background:#e2c199;
    color:#7a0f14;
    border-radius:25px;
    font-size:13px;
    font-weight:500;
}

.hero img{
    width:100%;
    border-radius:14px;
    margin-top:14px;
}

/* CATEGORY TABS */
.tabs{
    display:flex;
    gap:10px;
    padding:14px;
    overflow-x:auto;
}

.tab{
    padding:8px 14px;
    border-radius:20px;
    background:white;
    border:1px solid #ddd;
    font-size:13px;
    white-space:nowrap;
}

.tab.active{
    background:#8b1e2d;
    color:white;
}

/* PRODUCTS */
.products{
    padding:14px;
}

.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:14px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.card img{
    width:100%;
}

.card-content{
    padding:12px;
}

.name{
    font-size:14px;
}

.old{
    font-size:12px;
    text-decoration:line-through;
    color:#888;
}

.price{
    color:#8b1e2d;
    font-weight:600;
}

</style>
</head>

<body>

<header>
    <div class="nav">
        <div class="logo">
            <img src="logo.png">
            <span>Mangai Wear</span>
        </div>

        <div class="menu">
            <div onclick="goTop()">Home</div>
            <div onclick="scrollProducts()">Shop</div>
        </div>
    </div>
</header>

<div class="hero">
    <h1>Mangai Wear</h1>
    <p>Grace in every thread ✨</p>
    <div class="btn" onclick="scrollProducts()">Shop Now</div>


</div>

<!-- CATEGORY TABS -->
<div class="tabs">
    <div class="tab active" onclick="show(event,'top')">Kurti Top</div>
    <div class="tab" onclick="show(event,'3pcs')">3pcs</div>
    <div class="tab" onclick="show(event,'cord')">Cord Set</div>
    <div class="tab" onclick="show(event,'umbrella')">Umbrella</div>
    <div class="tab" onclick="show(event,'party')">Party Wear</div>
</div>

<!-- PRODUCTS -->
<div class="products" id="grid"></div>

<script>

const products = [

{ name:"Floral Kurti Top", old:"₹1899", price:"₹1299", category:"top", img:"https://via.placeholder.com/400x500" },
{ name:"Casual Daily Kurti", old:"₹1599", price:"₹1099", category:"top", img:"https://via.placeholder.com/400x500" },

{ name:"Elegant 3pcs Set", old:"₹2499", price:"₹1899", category:"3pcs", img:"https://via.placeholder.com/400x500" },
{ name:"Festive 3pcs Kurti", old:"₹2699", price:"₹1999", category:"3pcs", img:"https://via.placeholder.com/400x500" },

{ name:"Modern Cord Set", old:"₹2299", price:"₹1699", category:"cord", img:"https://via.placeholder.com/400x500" },
{ name:"Trendy Cord Outfit", old:"₹2199", price:"₹1599", category:"cord", img:"https://via.placeholder.com/400x500" },

{ name:"Umbrella Style Kurti", old:"₹1999", price:"₹1499", category:"umbrella", img:"https://via.placeholder.com/400x500" },
{ name:"Designer Umbrella Kurti", old:"₹2199", price:"₹1699", category:"umbrella", img:"https://via.placeholder.com/400x500" },

{ name:"Party Wear Designer", old:"₹2999", price:"₹2299", category:"party", img:"https://via.placeholder.com/400x500" },
{ name:"Luxury Party Kurti", old:"₹3299", price:"₹2599", category:"party", img:"https://via.placeholder.com/400x500" }

];

let filtered = products.filter(p => p.category === "top");

function render(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    filtered.forEach(p=>{
        grid.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <div class="card-content">
                <div class="name">${p.name}</div>
                <div class="old">${p.old}</div>
                <div class="price">${p.price}</div>
            </div>
        </div>`;
    });
}

function show(e,type){
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    e.target.classList.add("active");

    filtered = products.filter(p => p.category === type);
    render();
}

function goTop(){
    window.scrollTo(0,0);
}

function scrollProducts(){
    window.scrollTo(0,500);
}

render();

</script>

</body>
</html>
